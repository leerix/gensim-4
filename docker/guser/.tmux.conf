# Use Ctrl-a as prefix, like screen
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # Ctrl-a Ctrl-a sends a literal Ctrl-a

# screen-style bindings
bind C-c new-window            # Ctrl-a Ctrl-c = new window
bind C-d detach                # Ctrl-a Ctrl-d = detach
bind C-n next-window           # Ctrl-a Ctrl-n = next window
bind C-p previous-window       # Ctrl-a Ctrl-p = previous window
bind C-a last-window           # Ctrl-a Ctrl-a = toggle last window (after send-prefix above, this needs care)
bind Escape copy-mode          # Ctrl-a Esc = scrollback, like screen
bind A command-prompt "rename-window %%"  # Ctrl-a A = rename window
bind K confirm-before kill-window         # Ctrl-a K = kill window
bind '"' choose-window         # Ctrl-a \" = window list (tmux default is this already)

# Bigger scrollback
set -g history-limit 50000

# Status bar closer to screen's feel
# set -g status-bg black
# set -g status-fg white

# use vi mode
setw -g mode-keys vi

# move around panes like in vim (only in tmux 1.6)
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind h select-pane -L

# quick pane cycling with Ctrl-A
unbind C-A
bind C-A select-pane -t :.+

# last window C-a C-a
bind-key C-a last-window

# shell
set -g default-shell "/bin/bash"
if-shell 'test -e /opt/homebrew/bin/bash' 'set -g default-shell "/opt/homebrew/bin/bash"'

# mac pasteboard
if-shell 'test `uname` -eq Darwin' 'set-option -g default-command "reattach-to-user-namespace -l bash"'

# fast escapes
set -s escape-time 0

# mice
set -g mouse on

# Exit copy mode automatically when you stop scrolling (feels more native)
bind -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

# Scroll 3 lines at a time instead of tmux's default of 5, feels smoother on a trackpad
bind -T root WheelUpPane if-shell -F -t = "#{?pane_in_mode,1,#{mouse_any_flag}}" "send -Mt=" "if-shell -F -t = '#{alternate_on}' 'send -t= Up Up Up' 'copy-mode -et='"


# title
set -g set-titles on
set -g set-titles-string '#S: #W'

set -g focus-events on

# Automatic renaming - clean and useful
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'

# Allow manual rename to stick until the next command change
setw -g allow-rename on

# ==================== Solarized Light Status Bar ====================

set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left

# Main status bar colors (Solarized Light)
set -g status-style 'bg=#fdf6e3 fg=#586e75'

# Left side - Session name
set -g status-left-length 30
set -g status-left '#[fg=#268bd2,bg=#fdf6e3,bold] #S #[fg=#93a1a1]▏'

# Right side - minimal
set -g status-right-length 50
set -g status-right '#[fg=#93a1a1]▏#[fg=#586e75]%H:%M '

# Window status styling
setw -g window-status-separator ' '
setw -g window-status-style 'bg=#fdf6e3 fg=#657b83'
setw -g window-status-current-style 'bg=#eee8d5 fg=#268bd2 bold'

# Window format
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'bg=#fdf6e3 fg=#b58900 bold'

# Pane borders - Solarized Light
set -g pane-border-style 'fg=#93a1a1'
set -g pane-active-border-style 'fg=#268bd2'
