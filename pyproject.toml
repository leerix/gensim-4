[build-system]
requires = [
    "Cython>=3.1.3",
    # oldest supported Numpy for this platform is 1.17 but the oldest supported by Gensim
    # is 1.18.5, remove the line when they increase oldest supported Numpy for this platform.
    # pip's build isolation resolves the newest numpy compatible with the running
    # interpreter (e.g. numpy 2.x on Python 3.9-3.14), so no upper pin is needed here.
    "numpy>=1.18.5; python_version>='3.9' and platform_machine not in 'arm64|aarch64'",
    # "oldest-supported-numpy; python_version>'3.8' or platform_machine in 'arm64|aarch64'",
    "scipy",
    "setuptools",
    "wheel",
]
